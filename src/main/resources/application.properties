spring.application.name=ramossomar

# Perfil padrão: local. Em produção use SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Servidor
server.address=${SERVER_ADDRESS:localhost}
server.port=${SERVER_PORT:7000}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Banco de dados MySQL (sobrescrito por perfil)
spring.datasource.url=${DB_URL:jdbc:mysql://187.127.43.161:3306/db_ramossomar?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:C0nV3Mu2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# JSON em snake_case (Jackson 3 / Spring Boot 4)
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# JWT
jwt.issuer=ramossomar-api
jwt.audience=ramossomar-api
jwt.expiration-hours=24
jwt.clock-skew-seconds=30
jwt.secret=${JWT_SECRET:RamosSomarJwtSecretKey2026ConvertixSegurancaMuitoForteParaAssinaturaHS256}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:7000}
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With,X-Client-Id,X-Client-Secret,X-App-Version,X-Platform,X-Device-Id
app.cors.exposed-headers=X-RateLimit-Remaining,Retry-After,X-RateLimit-Limit
app.cors.max-age=3600
app.cors.allow-credentials=false

# Rate limiting (por IP)
app.rate-limit.login-per-minute=5
app.rate-limit.cadastro-per-minute=10
app.rate-limit.api-per-minute=100

# Identificação do app mobile (desligado em local; ligado em prod)
app.client.enabled=${APP_CLIENT_ENABLED:false}
app.client.id=${APP_CLIENT_ID:}
app.client.secret=${APP_CLIENT_SECRET:}

# Springdoc OpenAPI (sobrescrito em prod)
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# Abrir Swagger no navegador ao iniciar (apenas local)
app.swagger.abrir-navegador=true

# Admin bootstrap
app.admin.auto-create=true

# Upload de imagens
app.upload.diretorio=${APP_UPLOAD_DIR:uploads}
app.upload.url-base=/uploads
app.upload.tamanho-maximo-mb=5
app.upload.qualidade-compressao=0.75
app.upload.largura-maxima-px=1920
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Importação automática de cidades (IBGE) e locais de votação (TSE)
app.importacao.uf=GO
app.importacao.batch-size=500
app.importacao.ibge.municipios-url=https://servicodados.ibge.gov.br/api/v1/localidades/estados/{uf}/municipios
app.importacao.tse.locais-votacao-url=https://cdn.tse.jus.br/estatistica/sead/odsele/eleitorado_locais_votacao/eleitorado_local_votacao_2024.zip
