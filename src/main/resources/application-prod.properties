# =============================================================================
# Perfil PRODUÇÃO — segredos somente via variáveis de ambiente.
# Obrigatório: SPRING_PROFILES_ACTIVE=prod
# =============================================================================

server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:7000}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Preferir validate (ou Flyway) quando o schema estiver estável
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Swagger / OpenAPI — totalmente desabilitado
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.swagger.abrir-navegador=false

# JWT (obrigatório via env — mínimo 32 bytes)
jwt.secret=${JWT_SECRET}

# CORS — painel web (se houver). App mobile não depende de CORS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Identificação do app mobile
app.client.enabled=${APP_CLIENT_ENABLED:true}
app.client.id=${APP_CLIENT_ID}
app.client.secret=${APP_CLIENT_SECRET}

# Admin NÃO é criado automaticamente em produção
app.admin.auto-create=false

# HSTS / proxy reverso
server.forward-headers-strategy=framework
